{% load static%}
<!Doctype html>
<html>
    <head>
        <title>To-do List</title>
        {% comment %} <link rel="stylesheet" href="{% static 'main/css/to_do_list.css'%}"> {% endcomment %}
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        
        <div class="container p-3 my-3 bg-dark  text-white">
           
        <h1 class="d-flex justify-content-center align-items-center">To-Do List</h1>
        <input type="text"  id="task-input" placeholder="Add a new task...">
        <button class="btn btn-primary" id="add-task-btn">Add Task</button>
    
        <ul id="task-list"></ul>
        </div>
        <script src="{% static 'main/js/to_do_list.js' %}"></script>
    </body>
</html>
